<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OCR тест</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, sans-serif;
      background: #f6f8fb;
      color: #111827;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: start center;
      padding: 28px 14px;
      box-sizing: border-box;
    }

    .ocr-test {
      width: min(980px, 100%);
      display: grid;
      gap: 14px;
    }

    .ocr-test__header,
    .ocr-test__panel,
    .ocr-test__result {
      border: 1px solid #d8e2ef;
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 18px 42px rgba(15, 23, 42, 0.08);
    }

    .ocr-test__header {
      padding: 18px;
    }

    .ocr-test__title {
      margin: 0;
      font-size: 24px;
      line-height: 1.2;
      font-weight: 800;
    }

    .ocr-test__subtitle {
      margin: 8px 0 0;
      color: #5b677a;
      font-size: 14px;
      line-height: 1.5;
    }

    .ocr-test__panel {
      padding: 16px;
      display: grid;
      gap: 12px;
    }

    .ocr-test__file {
      display: grid;
      gap: 8px;
    }

    .ocr-test__file-label {
      font-size: 13px;
      font-weight: 800;
      color: #334155;
    }

    .ocr-test__input {
      min-height: 42px;
      box-sizing: border-box;
      width: 100%;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 9px 10px;
      background: #fff;
      color: #111827;
      font: inherit;
    }

    .ocr-test__actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .ocr-test__button {
      min-height: 40px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 0 14px;
      background: #fff;
      color: #111827;
      font: inherit;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }

    .ocr-test__button--primary {
      border-color: #2458ff;
      background: #2458ff;
      color: #fff;
    }

    .ocr-test__button:disabled {
      opacity: 0.55;
      cursor: default;
    }

    .ocr-test__status {
      min-height: 20px;
      color: #475569;
      font-size: 13px;
      line-height: 1.45;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .ocr-test__status--error {
      color: #b91c1c;
    }

    .ocr-test__status--success {
      color: #047857;
    }

    .ocr-test__meta {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 8px;
    }

    .ocr-test__metric {
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 10px;
      min-width: 0;
      background: #f8fafc;
    }

    .ocr-test__metric-label {
      font-size: 11px;
      line-height: 1.2;
      font-weight: 800;
      text-transform: uppercase;
      color: #64748b;
    }

    .ocr-test__metric-value {
      margin-top: 4px;
      font-size: 14px;
      line-height: 1.3;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .ocr-test__result {
      padding: 16px;
      display: grid;
      gap: 10px;
    }

    .ocr-test__result-title {
      margin: 0;
      font-size: 16px;
      line-height: 1.3;
      font-weight: 800;
    }

    .ocr-test__textarea {
      width: 100%;
      min-height: 360px;
      resize: vertical;
      box-sizing: border-box;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 12px;
      font: 14px/1.45 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color: #0f172a;
      background: #fff;
    }

    @media (max-width: 640px) {
      body {
        padding: 12px;
      }

      .ocr-test__actions {
        display: grid;
      }

      .ocr-test__button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="ocr-test">
    <section class="ocr-test__header">
      <h1 class="ocr-test__title">OCR тест</h1>
      <p class="ocr-test__subtitle">Загрузите PDF или картинку. Серверный режим использует локальные утилиты, браузерный режим работает без Docker и серверных прав.</p>
    </section>

    <section class="ocr-test__panel">
      <label class="ocr-test__file">
        <span class="ocr-test__file-label">Файл PDF или изображение</span>
        <input class="ocr-test__input" id="ocrFile" type="file" accept="application/pdf,image/*,.pdf,.png,.jpg,.jpeg,.webp,.tif,.tiff,.bmp">
      </label>
      <div class="ocr-test__actions">
        <button class="ocr-test__button ocr-test__button--primary" id="serverButton" type="button">Распознать на сервере</button>
        <button class="ocr-test__button" id="browserButton" type="button">Распознать в браузере</button>
        <button class="ocr-test__button" id="copyButton" type="button">Скопировать текст</button>
      </div>
      <div class="ocr-test__status" id="ocrStatus" role="status"></div>
      <div class="ocr-test__meta" id="ocrMeta"></div>
    </section>

    <section class="ocr-test__result">
      <h2 class="ocr-test__result-title">Результат</h2>
      <textarea class="ocr-test__textarea" id="ocrText" spellcheck="false"></textarea>
    </section>
  </main>

  <script>
    (function() {
      'use strict';

      var fileInput = document.getElementById('ocrFile');
      var serverButton = document.getElementById('serverButton');
      var browserButton = document.getElementById('browserButton');
      var copyButton = document.getElementById('copyButton');
      var statusNode = document.getElementById('ocrStatus');
      var metaNode = document.getElementById('ocrMeta');
      var textNode = document.getElementById('ocrText');
      var pdfLoader = null;
      var tesseractLoader = null;

      function selectedFile() {
        return fileInput && fileInput.files && fileInput.files[0] ? fileInput.files[0] : null;
      }

      function setBusy(isBusy) {
        serverButton.disabled = isBusy;
        browserButton.disabled = isBusy;
        copyButton.disabled = isBusy;
        fileInput.disabled = isBusy;
      }

      function setStatus(text, type) {
        statusNode.textContent = text || '';
        statusNode.classList.remove('ocr-test__status--error', 'ocr-test__status--success');
        if (type === 'error') {
          statusNode.classList.add('ocr-test__status--error');
        } else if (type === 'success') {
          statusNode.classList.add('ocr-test__status--success');
        }
      }

      function clearMeta() {
        metaNode.innerHTML = '';
      }

      function addMetric(label, value) {
        var metric = document.createElement('div');
        metric.className = 'ocr-test__metric';
        var title = document.createElement('div');
        title.className = 'ocr-test__metric-label';
        title.textContent = label;
        var body = document.createElement('div');
        body.className = 'ocr-test__metric-value';
        body.textContent = value || '—';
        metric.appendChild(title);
        metric.appendChild(body);
        metaNode.appendChild(metric);
      }

      function formatBytes(bytes) {
        var size = Number(bytes) || 0;
        if (size >= 1024 * 1024) {
          return (size / (1024 * 1024)).toFixed(size >= 10 * 1024 * 1024 ? 0 : 1).replace(/\.0$/, '') + ' МБ';
        }
        if (size >= 1024) {
          return Math.ceil(size / 1024) + ' КБ';
        }
        return size + ' Б';
      }

      async function readJsonResponse(response) {
        var text = await response.text();
        var payload = {};
        try {
          payload = text ? JSON.parse(text) : {};
        } catch (error) {
          throw new Error('Сервер вернул не JSON: ' + text.slice(0, 200));
        }
        if (!response.ok || payload.success === false) {
          throw new Error(payload.error || ('HTTP ' + response.status));
        }
        return payload;
      }

      function ensurePdfJsLoaded() {
        if (window.pdfjsLib) {
          return Promise.resolve(window.pdfjsLib);
        }
        if (pdfLoader) {
          return pdfLoader;
        }
        pdfLoader = new Promise(function(resolve, reject) {
          var script = document.createElement('script');
          script.src = '/pdf/pdf.min.js';
          script.onload = function() {
            if (!window.pdfjsLib) {
              reject(new Error('PDF.js не найден после загрузки.'));
              return;
            }
            window.pdfjsLib.GlobalWorkerOptions.workerSrc = '/pdf/pdf.worker.min.js';
            resolve(window.pdfjsLib);
          };
          script.onerror = function() {
            reject(new Error('Не удалось загрузить /pdf/pdf.min.js.'));
          };
          document.head.appendChild(script);
        });
        return pdfLoader;
      }

      function ensureTesseractLoaded() {
        if (window.Tesseract) {
          return Promise.resolve(window.Tesseract);
        }
        if (tesseractLoader) {
          return tesseractLoader;
        }
        tesseractLoader = new Promise(function(resolve, reject) {
          var script = document.createElement('script');
          script.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
          script.onload = function() {
            if (!window.Tesseract) {
              reject(new Error('Tesseract.js не найден после загрузки.'));
              return;
            }
            resolve(window.Tesseract);
          };
          script.onerror = function() {
            reject(new Error('Не удалось загрузить Tesseract.js. Проверьте интернет на компьютере.'));
          };
          document.head.appendChild(script);
        });
        return tesseractLoader;
      }

      async function extractPdfTextInBrowser(file) {
        var pdfjsLib = await ensurePdfJsLoaded();
        var bytes = await file.arrayBuffer();
        var pdf = await pdfjsLib.getDocument({ data: bytes }).promise;
        var maxPages = Math.min(pdf.numPages || 0, 10);
        var parts = [];
        for (var pageNumber = 1; pageNumber <= maxPages; pageNumber += 1) {
          setStatus('PDF.js: читаем текст страницы ' + pageNumber + ' из ' + maxPages + '…');
          var page = await pdf.getPage(pageNumber);
          var content = await page.getTextContent();
          var text = content.items.map(function(item) {
            return item && item.str ? item.str : '';
          }).join(' ').replace(/\s+/g, ' ').trim();
          if (text) {
            parts.push('--- Страница ' + pageNumber + ' ---\n' + text);
          }
        }
        return {
          text: parts.join('\n\n').trim(),
          pages: maxPages
        };
      }

      async function renderPdfFirstPage(file) {
        var pdfjsLib = await ensurePdfJsLoaded();
        var bytes = await file.arrayBuffer();
        var pdf = await pdfjsLib.getDocument({ data: bytes }).promise;
        var page = await pdf.getPage(1);
        var viewport = page.getViewport({ scale: 2 });
        var canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.floor(viewport.width));
        canvas.height = Math.max(1, Math.floor(viewport.height));
        var context = canvas.getContext('2d');
        if (!context) {
          throw new Error('Canvas недоступен в браузере.');
        }
        await page.render({ canvasContext: context, viewport: viewport }).promise;
        return {
          canvas: canvas,
          pages: pdf.numPages || 1
        };
      }

      async function recognizeImageInBrowser(source, label) {
        var Tesseract = await ensureTesseractLoaded();
        var result = await Tesseract.recognize(source, 'rus+eng', {
          logger: function(message) {
            if (!message || !message.status) {
              return;
            }
            var progress = typeof message.progress === 'number'
              ? ' ' + Math.round(message.progress * 100) + '%'
              : '';
            setStatus((label || 'OCR') + ': ' + message.status + progress);
          }
        });
        return result && result.data && result.data.text ? result.data.text.trim() : '';
      }

      async function runServerOcr() {
        var file = selectedFile();
        if (!file) {
          setStatus('Выберите файл.', 'error');
          return;
        }

        setBusy(true);
        clearMeta();
        textNode.value = '';
        setStatus('Отправляем файл на сервер…');
        try {
          var formData = new FormData();
          formData.append('file', file, file.name || 'ocr-file');
          var response = await fetch('/docs.php?action=ocr_test', {
            method: 'POST',
            credentials: 'same-origin',
            body: formData
          });
          var payload = await readJsonResponse(response);
          textNode.value = payload.text || '';
          addMetric('Файл', payload.fileName || file.name || '—');
          addMetric('Размер', formatBytes(payload.size || file.size));
          addMetric('Тип', payload.fileType || '—');
          addMetric('Метод', payload.method || '—');
          addMetric('Сервер', payload.serverOk ? 'текст получен' : 'нужны утилиты');
          if (payload.diagnostics) {
            addMetric('tesseract', payload.diagnostics.tesseractAvailable ? 'есть' : 'нет');
            addMetric('pdftotext', payload.diagnostics.pdftotextAvailable ? 'есть' : 'нет');
            addMetric('pdftoppm', payload.diagnostics.pdftoppmAvailable ? 'есть' : 'нет');
          }
          setStatus(payload.serverOk ? 'Серверный OCR завершён.' : (payload.error || 'Серверный OCR не получил текст.'), payload.serverOk ? 'success' : 'error');
        } catch (error) {
          setStatus(error && error.message ? error.message : 'Ошибка серверного OCR.', 'error');
        } finally {
          setBusy(false);
        }
      }

      async function runBrowserOcr() {
        var file = selectedFile();
        if (!file) {
          setStatus('Выберите файл.', 'error');
          return;
        }

        setBusy(true);
        clearMeta();
        textNode.value = '';
        try {
          var name = file.name || 'ocr-file';
          var isPdf = file.type === 'application/pdf' || /\.pdf$/i.test(name);
          addMetric('Файл', name);
          addMetric('Размер', formatBytes(file.size));
          addMetric('Режим', 'браузер');

          if (isPdf) {
            var extracted = await extractPdfTextInBrowser(file);
            if (extracted.text) {
              textNode.value = extracted.text;
              addMetric('Метод', 'PDF.js text layer');
              addMetric('Страниц', String(extracted.pages));
              setStatus('PDF содержит текстовый слой, OCR не понадобился.', 'success');
              return;
            }

            setStatus('Текстового слоя нет, распознаём первую страницу PDF через OCR…');
            var rendered = await renderPdfFirstPage(file);
            var pdfOcrText = await recognizeImageInBrowser(rendered.canvas, 'PDF первая страница');
            textNode.value = pdfOcrText;
            addMetric('Метод', 'PDF.js + Tesseract.js');
            addMetric('Страниц', '1 из ' + String(rendered.pages));
            setStatus(pdfOcrText ? 'Браузерный OCR первой страницы завершён.' : 'OCR первой страницы не вернул текст.', pdfOcrText ? 'success' : 'error');
            return;
          }

          var text = await recognizeImageInBrowser(file, 'Картинка');
          textNode.value = text;
          addMetric('Метод', 'Tesseract.js');
          setStatus(text ? 'Браузерный OCR завершён.' : 'OCR не вернул текст.', text ? 'success' : 'error');
        } catch (error) {
          setStatus(error && error.message ? error.message : 'Ошибка браузерного OCR.', 'error');
        } finally {
          setBusy(false);
        }
      }

      async function copyText() {
        var text = textNode.value || '';
        if (!text.trim()) {
          setStatus('Нечего копировать.', 'error');
          return;
        }
        try {
          await navigator.clipboard.writeText(text);
          setStatus('Текст скопирован.', 'success');
        } catch (error) {
          textNode.focus();
          textNode.select();
          document.execCommand('copy');
          setStatus('Текст выделен и скопирован старым способом.', 'success');
        }
      }

      serverButton.addEventListener('click', runServerOcr);
      browserButton.addEventListener('click', runBrowserOcr);
      copyButton.addEventListener('click', copyText);
      fileInput.addEventListener('change', function() {
        clearMeta();
        textNode.value = '';
        var file = selectedFile();
        setStatus(file ? 'Выбран файл: ' + file.name + ' (' + formatBytes(file.size) + ')' : '');
      });
    }());
  </script>
</body>
</html>
