<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Печать документа</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
      }

      body {
        background: #f1f5f9;
        color: #0f172a;
      }

      .appdosc-print__actions {
        position: fixed;
        z-index: 2;
        right: 16px;
        bottom: 16px;
        left: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 12px;
        border: 1px solid rgba(148, 163, 184, 0.38);
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.94);
        box-shadow: 0 14px 34px rgba(15, 23, 42, 0.16);
      }

      .appdosc-print__status {
        margin: 0;
        color: #475569;
        font-size: 14px;
      }

      .appdosc-print__button {
        min-height: 44px;
        padding: 0 20px;
        border: 0;
        border-radius: 12px;
        background: #2563eb;
        color: #fff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      .appdosc-print__button:disabled {
        cursor: wait;
        opacity: 0.6;
      }

      .appdosc-print__content {
        display: flex;
        width: 100%;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        padding: 0 0 84px;
        background: #fff;
      }

      .appdosc-print__frame {
        width: 100%;
        height: calc(100vh - 84px);
        border: 0;
        background: #fff;
      }

      .appdosc-print__image {
        display: block;
        width: auto;
        height: auto;
        max-width: 100%;
        max-height: calc(100vh - 84px);
        object-fit: contain;
      }

      @page {
        size: auto;
        margin: 0;
      }

      @media print {
        html,
        body,
        .appdosc-print__content {
          width: 100%;
          height: 100%;
          min-height: 0;
          margin: 0;
          padding: 0;
          background: #fff;
        }

        .appdosc-print__actions {
          display: none;
        }

        .appdosc-print__image {
          max-width: 100%;
          max-height: 100%;
          break-inside: avoid;
        }
      }
    </style>
  </head>
  <body>
    <main class="appdosc-print__content" data-print-content></main>
    <section class="appdosc-print__actions" aria-live="polite">
      <p class="appdosc-print__status" data-print-status>Загрузка оригинала…</p>
      <button class="appdosc-print__button" type="button" data-print-button disabled>Печать</button>
    </section>
    <script>
      (function initializeBrowserPrintPage() {
        const PRINT_DIALOG_DELAY_MS = 350;
        const params = new URLSearchParams(window.location.search);
        const rawSource = params.get('source') || '';
        const requestedKind = params.get('kind') || 'document';
        const fileName = params.get('name') || 'Документ';
        const content = document.querySelector('[data-print-content]');
        const status = document.querySelector('[data-print-status]');
        const printButton = document.querySelector('[data-print-button]');
        let printTarget = window;
        let isReady = false;

        document.title = `Печать — ${fileName}`;

        function resolveSafeSource(value) {
          try {
            const sourceUrl = new URL(value, window.location.origin);
            if (sourceUrl.origin !== window.location.origin) {
              return '';
            }
            const isDownloadEndpoint = sourceUrl.pathname === '/docs.php'
              && sourceUrl.searchParams.get('action') === 'mini_app_download_file';
            const isDocumentPath = sourceUrl.pathname.toLowerCase().startsWith('/documents/');
            return isDownloadEndpoint || isDocumentPath ? sourceUrl.toString() : '';
          } catch (_error) {
            return '';
          }
        }

        function setError(message) {
          isReady = false;
          status.textContent = message;
          printButton.disabled = true;
        }

        function callBrowserPrint() {
          if (!isReady || !printTarget || typeof printTarget.print !== 'function') {
            setError('Этот браузер не предоставил системную печать.');
            return;
          }
          try {
            printTarget.focus();
            printTarget.print();
            status.textContent = 'Если форма не открылась, нажмите «Печать» ещё раз.';
          } catch (_error) {
            setError('Браузер заблокировал системную печать.');
          }
        }

        function markReady(targetWindow) {
          printTarget = targetWindow || window;
          isReady = true;
          printButton.disabled = false;
          status.textContent = 'Открывается системная форма печати…';
          window.setTimeout(callBrowserPrint, PRINT_DIALOG_DELAY_MS);
        }

        printButton.addEventListener('click', callBrowserPrint);

        const source = resolveSafeSource(rawSource);
        if (!source) {
          setError('Некорректная ссылка на оригинал.');
          return;
        }

        if (requestedKind === 'image') {
          const image = document.createElement('img');
          image.className = 'appdosc-print__image';
          image.alt = fileName;
          image.addEventListener('load', () => markReady(window), { once: true });
          image.addEventListener('error', () => setError('Не удалось загрузить изображение.'), { once: true });
          image.src = source;
          content.append(image);
          return;
        }

        const frame = document.createElement('iframe');
        frame.className = 'appdosc-print__frame';
        frame.title = fileName;
        frame.addEventListener('load', () => {
          if (!frame.contentWindow) {
            setError('Браузер не смог открыть оригинал.');
            return;
          }
          markReady(frame.contentWindow);
        }, { once: true });
        frame.src = source;
        content.append(frame);
      })();
    </script>
  </body>
</html>
