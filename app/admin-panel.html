<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Админ-панель</title><link rel="stylesheet" href="./admin-panel.css"></head><body>
<div class="wrap"><h1>Управление пользователями</h1><p class="sub">Логины, пароли и права доступа</p>
<form id="userForm" class="glass">
<input type="hidden" id="id"><label>Логин<input id="login" required minlength="3"></label>
<label>ФИО<input id="full_name"></label>
<label>Пароль <small>(для изменения)</small><input id="password" type="password" minlength="6"></label>
<label class="check"><input id="is_active" type="checkbox" checked> Активен</label>
<div id="permissions" class="perm-grid"></div>
<div class="actions"><button type="submit">Сохранить</button><button type="button" id="resetBtn">Очистить</button></div>
</form>
<div id="list" class="list"></div><div id="status"></div></div>
<script src="./admin-panel.js"></script></body></html>
